name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify database security and booking lifecycle
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d tt_test -v ON_ERROR_STOP=1 -f tests/bootstrap.sql
          psql -h localhost -U postgres -d tt_test -v ON_ERROR_STOP=1 -f supabase/migrations/001_initial.sql
          psql -h localhost -U postgres -d tt_test -v ON_ERROR_STOP=1 -f tests/database.sql
